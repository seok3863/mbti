
<!-- 기존 pokemon-orb 안의 이모지 요소를 다음으로 교체 -->
<div class="pokemon-orb">
  <img
    class="pokemon-image"
    id="pokemonImage"
    src=""
    alt="선택한 포켓몬"
    width="160"
    height="160"
    loading="eager"
  >
</div>

<style>
  .pokemon-image {
    position: relative;
    z-index: 1;
    width: 160px;
    height: 160px;
    object-fit: contain;
    filter: drop-shadow(0 8px 7px #5b4d5220);
  }
</style>

<script>
  // 전국도감 번호를 사용해 이미지 주소를 구성합니다.
  // 이 방식은 인터넷 연결이 필요합니다.
  const pokemonImageNumbers = {
    ISTJ: "0007",
    ISFJ: "0133",
    INFJ: "0282",
    INTJ: "0150",
    ISTP: "0448",
    ISFP: "0001",
    INFP: "0700",
    INTP: "0474",
    ESTP: "0006",
    ESFP: "0025",
    ENFP: "0417",
    ENTP: "0094",
    ESTJ: "0068",
    ESFJ: "0039",
    ENFJ: "0448",
    ENTJ: "0149"
  };

  function updatePokemonImage(type) {
    const image = document.getElementById("pokemonImage");
    const number = pokemonImageNumbers[type];

    if (!number) return;

    image.src =
      "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/" +
      Number(number) + ".png";

    image.alt = type + " 유형의 포켓몬";
  }
</script>
